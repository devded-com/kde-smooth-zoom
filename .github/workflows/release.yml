name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build applet
        run: make applet
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/com.devded.kde-smooth-zoom.plasmoid
            install.sh
          generate_release_notes: true
